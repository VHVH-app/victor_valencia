<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>CSS3 Embedded Fonts</title>

<style type="text/css">

@font-face{
	font-family:'JurassicPark';
	src: url('fonts/JurassicPark.eot'); 
	src: local('JurassicPark'), url('fonts/JurassicPark.ttf') format('truetype') ;
   
}

p{
	font-family:JurassicPark,Geneva,serif;
	font-size: 36px;

}

</style>


</head>
<body>

<p>
	What is your favorite Dino movie?  This font is called Jurassic Park.  Does it make you think of the movie?
</p>



</body></html>
